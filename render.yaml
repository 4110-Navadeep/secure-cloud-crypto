services:
  # ---------------------------------------------------------------------------
  # Node.js/Express Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: secure-cloud-file-sharing
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        fromDatabase:
          name: secure-cloud-mysql
          property: host
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        fromDatabase:
          name: secure-cloud-mysql
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: secure-cloud-mysql
          property: password
      - key: DB_NAME
        fromDatabase:
          name: secure-cloud-mysql
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: APPLICATION_SECRET
        generateValue: true
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false

# ---------------------------------------------------------------------------
# MySQL Database Resource
# ---------------------------------------------------------------------------
databases:
  - name: secure-cloud-mysql
    plan: starter
    databaseName: secure_cloud_db
    user: secure_admin
