<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Administrator — Secure Cloud</title>
  <meta name="description" content="Create the first administrator account for Secure Cloud File Sharing System">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .setup-wrap { width: 100%; max-width: 480px; }
    .setup-header { text-align: center; margin-bottom: 40px; }
    .setup-logo { font-size: 48px; margin-bottom: 16px; display: block; }
    .setup-title { font-size: 28px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; }
    .setup-subtitle { color: var(--text-secondary); font-size: 14px; }
    .setup-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--border-radius-lg); padding: 36px; box-shadow: var(--shadow-card); }
    .setup-section-title {
      font-size: 14px; font-weight: 700; color: var(--accent-cyan);
      text-transform: uppercase; letter-spacing: 2px;
      margin-bottom: 24px; padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .security-note { margin-top: 24px; padding: 14px; background: var(--accent-cyan-dim); border: 1px solid var(--border-light); border-radius: var(--border-radius-sm); font-size: 12px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="setup-wrap">
    <div class="setup-header">
      <span class="setup-logo">🔐</span>
      <div class="setup-title">SECURE CLOUD</div>
      <div class="setup-subtitle">Hybrid Cryptography File Sharing System</div>
    </div>

    <div class="setup-card">
      <div class="setup-section-title">Create Administrator Account</div>

      <div id="setup-alert" class="hidden"></div>

      <form id="setup-form">
        <div class="form-group">
          <label class="form-label" for="full_name">Full Name</label>
          <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Your full name" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="admin@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Minimum 8 characters" required autocomplete="new-password" minlength="8">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repeat password" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg" id="submit-btn">
          <span id="btn-text">Create Administrator Account</span>
          <span id="btn-spinner" class="spinner hidden"></span>
        </button>
      </form>

      <div class="security-note">
        🔒 Your password will be hashed using bcrypt. An RSA-2048 key pair will be generated for your account.
        This setup page is only available once — it will be disabled after creation.
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Redirect if already set up
    (async () => {
      const r = await fetch('/api/auth/setup-status').then(d => d.json()).catch(() => null);
      if (r && !r.setupRequired) window.location.href = '/login.html';
    })();

    document.getElementById('setup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById('setup-alert');
      const btn = document.getElementById('submit-btn');
      const spinner = document.getElementById('btn-spinner');
      const btnText = document.getElementById('btn-text');

      alertEl.className = 'hidden';
      btn.disabled = true;
      spinner.classList.remove('hidden');
      btnText.textContent = 'Creating account...';

      const data = {
        full_name: document.getElementById('full_name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        confirm_password: document.getElementById('confirm_password').value,
      };

      try {
        await API.post('/auth/setup', data);
        alertEl.className = 'alert alert-success';
        alertEl.textContent = '✅ Administrator account created! Redirecting to login...';
        setTimeout(() => window.location.href = '/login.html', 2000);
      } catch (err) {
        alertEl.className = 'alert alert-danger';
        alertEl.textContent = '❌ ' + err.message;
        btn.disabled = false;
        spinner.classList.add('hidden');
        btnText.textContent = 'Create Administrator Account';
      }
    });
  </script>
</body>
</html>
