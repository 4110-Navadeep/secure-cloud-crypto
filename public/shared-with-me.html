<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared With Me — Secure Cloud</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    /* Preview area in modal */
    .preview-container {
      width: 100%;
      height: 400px;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-sm);
      background: var(--bg-input);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 16px;
    }
    .preview-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .preview-text {
      width: 100%;
      height: 100%;
      white-space: pre-wrap;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-placeholder"></div>
    <div class="main-content">
      <header class="top-header">
        <div class="d-flex align-center gap-12">
          <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
          <h1 class="page-title">📨 Shared With Me</h1>
        </div>
        <span class="badge badge-cyan">MODULE 3</span>
      </header>
      <div class="page-container">
        <div class="card">
          <div class="card-header">
            <div class="card-title">📨 Received Files</div>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>File</th>
                  <th>Owner</th>
                  <th>Permission</th>
                  <th>Received Date</th>
                  <th>Expiration</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="received-table">
                <tr><td colspan="7" class="table-empty"><div class="spinner"></div> Loading received files...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Preview Modal -->
  <div class="modal-overlay" id="preview-modal">
    <div class="modal" style="max-width: 700px;">
      <div class="modal-header">
        <div class="modal-title">🖼️ Secure File Preview</div>
        <button class="modal-close" onclick="closePreviewModal()">×</button>
      </div>
      <div class="modal-body">
        <div id="preview-spinner" style="text-align:center; padding: 40px;">
          <div class="spinner spinner-lg"></div>
          <p style="margin-top: 16px;" class="text-muted">Decrypting and verifying payload...</p>
        </div>
        <div id="preview-content-area" class="hidden">
          <p class="text-muted mb-16" style="font-size:12px;">
            🔒 Verified Authentic · Signature Valid · Integrity Verified
          </p>
          <div class="preview-container" id="preview-container">
            <!-- Rendered inline based on file type -->
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closePreviewModal()">Close Preview</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/sidebar.js"></script>
  <script>
    requireAuth();
    document.getElementById('sidebar-placeholder').innerHTML = renderSidebar();
    initSidebar('shared-with-me');

    async function loadReceived() {
      try {
        const data = await API.get('/sharing/with-me');
        const shares = data.shares || [];

        const tbody = document.getElementById('received-table');
        if (shares.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="table-empty">No files have been shared with you yet.</td></tr>';
          return;
        }

        tbody.innerHTML = shares.map(s => {
          const isExpired = s.effective_status === 'expired';
          const isRevoked = s.effective_status === 'revoked';
          const hasPreview = ['preview', 'preview_download'].includes(s.permission);
          const hasDownload = ['download', 'preview_download'].includes(s.permission);

          return `
            <tr>
              <td>
                <div class="d-flex align-center gap-8">
                  <span>${getMimeIcon(s.mime_type)}</span>
                  <div>
                    <div style="font-weight:600; color: var(--text-primary);">${s.original_filename}</div>
                    <div style="font-size:11px; color: var(--text-muted);">${formatBytes(s.original_size)}</div>
                  </div>
                </div>
              </td>
              <td>
                <div>
                  <div class="fw-medium">${s.owner_name}</div>
                  <div style="font-size: 11px; color: var(--text-muted);">${s.owner_email}</div>
                </div>
              </td>
              <td><span class="badge badge-cyan">${getPermissionLabel(s.permission)}</span></td>
              <td><span class="text-muted" title="${formatDate(s.created_at)}">${timeAgo(s.created_at)}</span></td>
              <td><span class="text-muted">${s.expires_at ? formatDate(s.expires_at) : 'Never'}</span></td>
              <td>${getStatusBadge(s.effective_status)}</td>
              <td>
                <div class="d-flex gap-8">
                  ${(isExpired || isRevoked) ? `
                    <span class="text-muted">Access Denied</span>
                  ` : `
                    ${hasPreview ? `<button class="btn btn-secondary btn-sm" onclick="previewFile('${s.file_id}')">🖼️ Open</button>` : ''}
                    ${hasDownload ? `<button class="btn btn-success btn-sm" onclick="downloadFile('${s.file_id}', '${s.original_filename.replace(/'/g, "\\'")}')">⬇️ Download</button>` : ''}
                  `}
                </div>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        document.getElementById('received-table').innerHTML = `<tr><td colspan="7" class="table-empty text-danger">Error: ${err.message}</td></tr>`;
      }
    }

    async function downloadFile(fileId, filename) {
      if (!confirm('Decrypt and download original file? Signature and integrity will be verified.')) return;
      try {
        await API.download(`/files/${fileId}/download-original`, filename);
        showToast('Decryption and verification successful. File downloaded!', 'success');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function previewFile(fileId) {
      document.getElementById('preview-modal').classList.add('active');
      document.getElementById('preview-spinner').classList.remove('hidden');
      document.getElementById('preview-content-area').classList.add('hidden');

      const container = document.getElementById('preview-container');
      container.innerHTML = '';

      try {
        const response = await fetch(`/api/files/${fileId}/download-original`, {
          headers: { 'Authorization': 'Bearer ' + API.getToken() }
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || 'Failed to decrypt/retrieve preview');
        }

        const blob = await response.blob();
        const type = response.headers.get('content-type') || '';
        
        if (type.startsWith('image/')) {
          const img = document.createElement('img');
          img.className = 'preview-img';
          img.src = URL.createObjectURL(blob);
          container.appendChild(img);
        } else if (type.startsWith('text/') || type === 'application/json') {
          const text = await blob.text();
          const pre = document.createElement('pre');
          pre.className = 'preview-text';
          pre.textContent = text;
          container.appendChild(pre);
        } else if (type === 'application/pdf') {
          const iframe = document.createElement('iframe');
          iframe.style.width = '100%';
          iframe.style.height = '100%';
          iframe.style.border = 'none';
          iframe.src = URL.createObjectURL(blob);
          container.appendChild(iframe);
        } else {
          container.innerHTML = `<div class="text-center text-muted">
            <span style="font-size:36px; display:block; margin-bottom:8px;">📄</span>
            Preview not supported for mime-type: <span class="mono">${type}</span>.<br>
            Please use download option if permitted.
          </div>`;
        }

        document.getElementById('preview-spinner').classList.add('hidden');
        document.getElementById('preview-content-area').classList.remove('hidden');

      } catch (err) {
        showToast(err.message, 'error');
        closePreviewModal();
      }
    }

    function closePreviewModal() {
      document.getElementById('preview-modal').classList.remove('active');
    }

    loadReceived();
  </script>
</body>
</html>
