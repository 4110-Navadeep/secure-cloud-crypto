<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Secure Crypt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-card {
      border-color: rgba(124, 77, 255, 0.3) !important;
      box-shadow: 0 8px 32px rgba(124, 77, 255, 0.15) !important;
    }
    .admin-logo {
      color: #b39ddb !important;
    }
  </style>
</head>
<body class="app-body">
  <div class="auth-wrapper">
    <!-- Login Tab -->
    <div class="auth-card admin-card" id="login-tab">
      <div class="auth-header">
        <div class="auth-logo admin-logo">
          <span>💼</span> ADMIN <span style="color: #b39ddb;">PORTAL</span>
        </div>
        <div class="auth-subtitle">Operational Control &amp; Key Governance</div>
      </div>

      <form id="admin-login-form">
        <div class="auth-form-group">
          <label class="auth-label" for="email">Admin Email</label>
          <input class="auth-input" type="email" id="email" placeholder="admin@securecrypt.com" required>
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="password">Password</label>
          <input class="auth-input" type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-decrypt-lg w-full" style="margin: 20px 0; width: 100%;" id="login-btn">
          <span id="login-btn-text">🛡️ Unlock Console</span>
          <span id="login-spinner" class="btn-spinner hidden"></span>
        </button>
      </form>

      <div class="auth-footer-links" style="justify-content: space-between;">
        <a href="/login.html" class="auth-link">User Login</a>
        <a href="javascript:void(0)" onclick="toggleTab('setup-tab')" class="auth-link" style="color:#b39ddb;">Bootstrap Admin</a>
      </div>
    </div>

    <!-- Bootstrap Tab -->
    <div class="auth-card admin-card hidden" id="setup-tab">
      <div class="auth-header">
        <div class="auth-logo admin-logo">
          <span>⚙️</span> BOOTSTRAP <span style="color: #b39ddb;">ADMIN</span>
        </div>
        <div class="auth-subtitle">Setup the primary administrator (Once-off)</div>
      </div>

      <form id="setup-form">
        <div class="auth-form-group">
          <label class="auth-label" for="setup-token">Setup Token (from .env)</label>
          <input class="auth-input" type="password" id="setup-token" placeholder="ADMIN_SETUP_TOKEN" required>
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="setup-name">Admin Name</label>
          <input class="auth-input" type="text" id="setup-name" placeholder="Super User" required>
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="setup-email">Admin Email</label>
          <input class="auth-input" type="email" id="setup-email" placeholder="admin@domain.com" required>
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="setup-password">Setup Password (min 10 chars)</label>
          <input class="auth-input" type="password" id="setup-password" placeholder="••••••••••" required>
        </div>

        <button type="submit" class="btn-decrypt-lg w-full" style="margin: 20px 0; width: 100%;" id="setup-btn">
          <span id="setup-btn-text">🏗️ Initialize Admin</span>
          <span id="setup-spinner" class="btn-spinner hidden"></span>
        </button>
      </form>

      <div class="auth-footer-links" style="justify-content: center;">
        <a href="javascript:void(0)" onclick="toggleTab('login-tab')" class="auth-link">Back to Admin Login</a>
      </div>
    </div>
  </div>

  <script src="/js/shared.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (isLoggedIn() && isAdmin()) {
      window.location.href = '/admin-panel.html';
    }

    function toggleTab(id) {
      document.getElementById('login-tab').classList.add('hidden');
      document.getElementById('setup-tab').classList.add('hidden');
      document.getElementById(id).classList.remove('hidden');
    }

    // Login Form
    const loginForm = document.getElementById('admin-login-form');
    const loginBtn = document.getElementById('login-btn');
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      loginBtn.disabled = true;
      document.getElementById('login-btn-text').textContent = 'Authenticating...';
      document.getElementById('login-spinner').classList.remove('hidden');

      try {
        const response = await fetch('/api/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Admin login failed.');

        saveSession(data.token, data.user);
        showToast('Admin access granted!', 'success');
        setTimeout(() => { window.location.href = '/admin-panel.html'; }, 1000);
      } catch (err) {
        showToast(err.message, 'error');
        loginBtn.disabled = false;
        document.getElementById('login-btn-text').textContent = '🛡️ Unlock Console';
        document.getElementById('login-spinner').classList.add('hidden');
      }
    });

    // Setup Form
    const setupForm = document.getElementById('setup-form');
    const setupBtn = document.getElementById('setup-btn');
    setupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('setup-token').value;
      const name = document.getElementById('setup-name').value.trim();
      const email = document.getElementById('setup-email').value.trim();
      const password = document.getElementById('setup-password').value;

      setupBtn.disabled = true;
      document.getElementById('setup-btn-text').textContent = 'Deploying...';
      document.getElementById('setup-spinner').classList.remove('hidden');

      try {
        const response = await fetch('/api/auth/admin/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, name, email, password })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Bootstrap failed.');

        showToast('Primary administrator created successfully! Please login.', 'success');
        setupForm.reset();
        setTimeout(() => { toggleTab('login-tab'); }, 1500);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        setupBtn.disabled = false;
        document.getElementById('setup-btn-text').textContent = '🏗️ Initialize Admin';
        document.getElementById('setup-spinner').classList.add('hidden');
      }
    });
  </script>
</body>
</html>
