<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Files — Secure Cloud</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-placeholder"></div>
    <div class="main-content">
      <header class="top-header">
        <div class="d-flex align-center gap-12">
          <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
          <h1 class="page-title">📁 My Files</h1>
        </div>
        <a href="/encryption.html" class="btn btn-primary btn-sm">+ Encrypt New File</a>
      </header>
      <div class="page-container">
        <div class="card">
          <div class="card-header">
            <div class="card-title">🔒 Encrypted Files</div>
            <span id="file-count" class="badge badge-cyan">0 files</span>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>File</th>
                  <th>Size</th>
                  <th class="hide-mobile">Encrypted Size</th>
                  <th class="hide-mobile">Algorithm</th>
                  <th class="hide-mobile">Shared</th>
                  <th>Uploaded</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="files-table">
                <tr><td colspan="7" class="table-empty"><div class="spinner"></div> Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="modal-overlay" id="share-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">🤝 Share File</div>
        <button class="modal-close" onclick="closeShareModal()">×</button>
      </div>
      <div class="modal-body">
        <p class="text-muted" style="margin-bottom: 16px; font-size: 13px;">Share: <strong id="share-filename"></strong></p>
        <input type="hidden" id="share-file-id">
        <div class="form-group">
          <label class="form-label">Recipient Email</label>
          <select class="form-control" id="share-member">
            <option value="">Select a member...</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Permission</label>
          <select class="form-control" id="share-permission">
            <option value="preview">Preview Only</option>
            <option value="download">Download</option>
            <option value="preview_download">Preview &amp; Download</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Expiration (optional)</label>
          <input type="datetime-local" class="form-control" id="share-expiry">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeShareModal()">Cancel</button>
        <button class="btn btn-primary" id="confirm-share-btn" onclick="confirmShare()">🔐 Confirm Secure Share</button>
      </div>
    </div>
  </div>

  <!-- Download Modal -->
  <div class="modal-overlay" id="download-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">📦 Download Secure Package</div>
        <button class="modal-close" onclick="document.getElementById('download-modal').classList.remove('active')">×</button>
      </div>
      <div class="modal-body">
        <p class="text-secondary" style="font-size: 13px; margin-bottom: 16px;">Enter the passphrase used during encryption to create the .secure package for external sharing.</p>
        <input type="hidden" id="dl-file-id">
        <input type="hidden" id="dl-filename">
        <div class="form-group">
          <label class="form-label">Passphrase</label>
          <input type="password" class="form-control" id="dl-passphrase" placeholder="Encryption passphrase">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="document.getElementById('download-modal').classList.remove('active')">Cancel</button>
        <button class="btn btn-primary" onclick="downloadSecure()">📥 Download .secure</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/sidebar.js"></script>
  <script>
    requireAuth();
    document.getElementById('sidebar-placeholder').innerHTML = renderSidebar();
    initSidebar('my-files');

    async function loadFiles() {
      try {
        const data = await API.get('/files');
        const files = data.files || [];
        document.getElementById('file-count').textContent = files.length + ' files';

        const tbody = document.getElementById('files-table');
        if (files.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="table-empty">No encrypted files yet. <a href="/encryption.html" style="color:var(--accent-cyan)">Encrypt your first file →</a></td></tr>';
          return;
        }

        tbody.innerHTML = files.map(f => `
          <tr>
            <td>
              <div class="d-flex align-center gap-8">
                <span>${getMimeIcon(f.mime_type)}</span>
                <div>
                  <div style="font-weight:600; color: var(--text-primary);">${f.original_filename}</div>
                  <div style="font-size:11px; color: var(--text-muted);">${f.mime_type || '—'}</div>
                </div>
              </div>
            </td>
            <td>${formatBytes(f.original_size)}</td>
            <td class="hide-mobile">${formatBytes(f.encrypted_size)}</td>
            <td class="hide-mobile"><span class="badge badge-cyan">${f.encryption_algorithm}</span></td>
            <td class="hide-mobile"><span class="badge badge-info">${f.share_count} shared</span></td>
            <td><span class="text-muted" title="${formatDate(f.created_at)}">${timeAgo(f.created_at)}</span></td>
            <td>
              <div class="d-flex gap-8">
                <button class="btn btn-secondary btn-sm" onclick="openShareModal('${f.id}', '${f.original_filename.replace(/'/g,"\\'")}')">🤝 Share</button>
                <button class="btn btn-secondary btn-sm" onclick="openDownloadModal('${f.id}', '${f.original_filename.replace(/'/g,"\\'")}')">📦</button>
                <button class="btn btn-success btn-sm" onclick="downloadOriginal('${f.id}', '${f.original_filename.replace(/'/g,"\\'")}')">⬇️</button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        document.getElementById('files-table').innerHTML = `<tr><td colspan="7" class="table-empty text-danger">Error: ${err.message}</td></tr>`;
      }
    }

    let members = [];
    async function openShareModal(fileId, filename) {
      document.getElementById('share-file-id').value = fileId;
      document.getElementById('share-filename').textContent = filename;
      document.getElementById('share-modal').classList.add('active');

      if (members.length === 0) {
        try {
          const data = await API.get('/sharing/members');
          members = data.members || [];
        } catch {}
      }

      const select = document.getElementById('share-member');
      select.innerHTML = '<option value="">Select a member...</option>' +
        members.map(m => `<option value="${m.email}">${m.full_name} (${m.email})</option>`).join('');
    }

    function closeShareModal() {
      document.getElementById('share-modal').classList.remove('active');
    }

    async function confirmShare() {
      const fileId = document.getElementById('share-file-id').value;
      const email = document.getElementById('share-member').value;
      const permission = document.getElementById('share-permission').value;
      const expires = document.getElementById('share-expiry').value;

      if (!email) { showToast('Please select a member', 'warning'); return; }

      try {
        await API.post('/sharing', {
          file_id: fileId,
          shared_with_email: email,
          permission,
          expires_at: expires || null,
        });
        showToast('File shared successfully!', 'success');
        closeShareModal();
      } catch (err) {
        showToast('Share failed: ' + err.message, 'error');
      }
    }

    function openDownloadModal(fileId, filename) {
      document.getElementById('dl-file-id').value = fileId;
      document.getElementById('dl-filename').value = filename;
      document.getElementById('dl-passphrase').value = '';
      document.getElementById('download-modal').classList.add('active');
    }

    async function downloadSecure() {
      const fileId = document.getElementById('dl-file-id').value;
      const filename = document.getElementById('dl-filename').value;
      const pass = document.getElementById('dl-passphrase').value;
      if (!pass) { showToast('Enter passphrase', 'warning'); return; }
      try {
        await API.download(`/files/${fileId}/download-secure?passphrase=${encodeURIComponent(pass)}`,
          filename.replace(/\.[^.]+$/, '') + '.secure');
        showToast('.secure package downloaded!', 'success');
        document.getElementById('download-modal').classList.remove('active');
      } catch (err) { showToast('Download failed: ' + err.message, 'error'); }
    }

    async function downloadOriginal(fileId, filename) {
      if (!confirm('Download the decrypted original file? Integrity and signature will be verified.')) return;
      try {
        await API.download(`/files/${fileId}/download-original`, filename);
        showToast('File decrypted and downloaded!', 'success');
      } catch (err) { showToast('Download failed: ' + err.message, 'error'); }
    }

    loadFiles();
  </script>
</body>
</html>
