<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Activity — Secure Cloud</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-placeholder"></div>
    <div class="main-content">
      <header class="top-header">
        <div class="d-flex align-center gap-12">
          <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
          <h1 class="page-title">📋 Security Activity Log</h1>
        </div>
      </header>

      <div class="page-container">
        
        <!-- Filters -->
        <div class="card mb-24">
          <div class="card-header">
            <div class="card-title">🔍 Filters</div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
            <div class="form-group" style="margin:0;">
              <label class="form-label">Event Type</label>
              <select id="filter-event" class="form-control">
                <option value="">All Events</option>
                <option value="LOGIN_SUCCESS">LOGIN_SUCCESS</option>
                <option value="LOGIN_FAILED">LOGIN_FAILED</option>
                <option value="FILE_UPLOAD">FILE_UPLOAD</option>
                <option value="FILE_ENCRYPTED">FILE_ENCRYPTED</option>
                <option value="FILE_SHARED">FILE_SHARED</option>
                <option value="FILE_DOWNLOAD">FILE_DOWNLOAD</option>
                <option value="SIGNATURE_VERIFIED">SIGNATURE_VERIFIED</option>
                <option value="INTEGRITY_VERIFIED">INTEGRITY_VERIFIED</option>
                <option value="SIGNATURE_FAILED">SIGNATURE_FAILED</option>
                <option value="INTEGRITY_FAILED">INTEGRITY_FAILED</option>
                <option value="DECRYPTION_FAILED">DECRYPTION_FAILED</option>
                <option value="ACCESS_DENIED">ACCESS_DENIED</option>
              </select>
            </div>
            <div class="form-group" style="margin:0;">
              <label class="form-label">Status</label>
              <select id="filter-status" class="form-control">
                <option value="">All Statuses</option>
                <option value="success">Success</option>
                <option value="failure">Failure</option>
                <option value="warning">Warning</option>
              </select>
            </div>
            <div class="form-group" style="margin:0; display:flex; align-items:flex-end;">
              <button class="btn btn-primary w-100" id="apply-filters-btn">Apply Filters</button>
            </div>
          </div>
        </div>

        <!-- Activity Log List -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">📋 Historic Security Audit Logs</div>
          </div>
          
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Timestamp</th>
                  <th>User</th>
                  <th>Event</th>
                  <th>File Involved</th>
                  <th>IP Address</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="logs-table">
                <tr><td colspan="6" class="table-empty"><div class="spinner"></div> Loading logs...</td></tr>
              </tbody>
            </table>
          </div>

          <div class="d-flex justify-between align-center mt-24" id="pagination">
            <button class="btn btn-secondary btn-sm" id="prev-page" disabled>Previous</button>
            <span class="text-secondary" style="font-size:13px;" id="page-indicator">Page 1</span>
            <button class="btn btn-secondary btn-sm" id="next-page" disabled>Next</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/sidebar.js"></script>
  <script>
    requireAuth();
    document.getElementById('sidebar-placeholder').innerHTML = renderSidebar();
    initSidebar('security-activity');

    let currentPage = 1;
    const limit = 50;

    async function loadLogs() {
      const eventVal = document.getElementById('filter-event').value;
      const statusVal = document.getElementById('filter-status').value;
      const tbody = document.getElementById('logs-table');
      tbody.innerHTML = '<tr><td colspan="6" class="table-empty"><div class="spinner"></div> Loading logs...</td></tr>';

      try {
        let url = `/security/logs?page=${currentPage}&limit=${limit}`;
        if (eventVal) url += `&event=${eventVal}`;
        if (statusVal) url += `&status=${statusVal}`;

        const data = await API.get(url);
        const logs = data.logs || [];
        const total = data.total || 0;

        if (logs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="table-empty">No security logs matching the current criteria.</td></tr>';
          updatePagination(0);
          return;
        }

        tbody.innerHTML = logs.map(l => `
          <tr>
            <td><span class="text-secondary">${formatDate(l.created_at)}</span></td>
            <td>
              ${l.user_name ? `<div>${l.user_name}</div><div style="font-size:11px;color:var(--text-muted)">${l.user_email}</div>` : '<span class="text-muted">System/Anon</span>'}
            </td>
            <td><span class="mono">${l.event_type}</span></td>
            <td>
              ${l.original_filename ? `<span title="${l.original_filename}">${truncate(l.original_filename, 30)}</span>` : '<span class="text-muted">—</span>'}
            </td>
            <td><span class="mono">${l.ip_address || '—'}</span></td>
            <td>${getStatusBadge(l.status)}</td>
          </tr>
        `).join('');

        updatePagination(total);

      } catch (err) {
        showToast('Failed to load logs: ' + err.message, 'error');
      }
    }

    function updatePagination(total) {
      const totalPages = Math.ceil(total / limit) || 1;
      document.getElementById('page-indicator').textContent = `Page ${currentPage} of ${totalPages} (${total} total)`;
      document.getElementById('prev-page').disabled = currentPage <= 1;
      document.getElementById('next-page').disabled = currentPage >= totalPages;
    }

    document.getElementById('prev-page').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        loadLogs();
      }
    });

    document.getElementById('next-page').addEventListener('click', () => {
      currentPage++;
      loadLogs();
    });

    document.getElementById('apply-filters-btn').addEventListener('click', () => {
      currentPage = 1;
      loadLogs();
    });

    loadLogs();
  </script>
</body>
</html>
